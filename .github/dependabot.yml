version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /services/order-service
      - /services/inventory-service
      - /services/promise-service
      - /services/returns-service
      - /services/api-gateway
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /services/order-service
      - /services/inventory-service
      - /services/promise-service
      - /services/returns-service
      - /services/api-gateway
    schedule:
      interval: weekly
