global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: order-service
    static_configs:
      - targets: ["order-service:45000"]
  - job_name: inventory-service
    static_configs:
      - targets: ["inventory-service:45001"]
  - job_name: promise-service
    static_configs:
      - targets: ["promise-service:45002"]
  - job_name: returns-service
    static_configs:
      - targets: ["returns-service:45003"]
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:45004"]
